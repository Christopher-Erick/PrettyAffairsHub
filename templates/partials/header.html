{% load static %}
<header class="site-header" data-header>
  <div class="site-header__bar">
    <button
      class="icon-btn site-header__menu-btn"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-nav"
      data-nav-toggle
    >
      <span class="visually-hidden">Open menu</span>
      <span class="icon-btn__lines" aria-hidden="true"></span>
    </button>

    <a class="site-header__brand" href="{% url 'content:home' %}">
      <img
        class="site-header__logo"
        src="{% static 'img/logo.png' %}"
        alt="{{ SITE_NAME }}"
        width="180"
        height="72"
      >
    </a>

    <div class="site-header__utils">
      <a class="text-link" href="{% url 'catalog:shop' %}">Search</a>
      <a class="text-link" href="#">Account</a>
      <a class="text-link" href="#" aria-label="Shopping cart, 0 items">Cart (0)</a>
    </div>
  </div>

  <nav class="site-nav" aria-label="Primary">
    <ul class="site-nav__list">
      <li><a class="site-nav__link{% if request.resolver_match.url_name == 'home' %} is-active{% endif %}" href="{% url 'content:home' %}">Home</a></li>
      <li><a class="site-nav__link{% if request.resolver_match.app_name == 'catalog' %} is-active{% endif %}" href="{% url 'catalog:shop' %}">Shop</a></li>
      <li><a class="site-nav__link" href="{% url 'catalog:shop' %}#new">New arrivals</a></li>
      <li><a class="site-nav__link" href="{% url 'catalog:shop' %}#bestsellers">Best sellers</a></li>
      <li><a class="site-nav__link" href="{% url 'catalog:shop' %}#bundles">Bundles</a></li>
      <li><a class="site-nav__link" href="#about">About</a></li>
    </ul>
  </nav>

  <div class="mobile-nav" id="mobile-nav" data-mobile-nav hidden>
    <nav aria-label="Mobile">
      <ul class="mobile-nav__list">
        <li><a href="{% url 'content:home' %}">Home</a></li>
        <li><a href="{% url 'catalog:shop' %}">Shop</a></li>
        <li><a href="{% url 'catalog:shop' %}#new">New arrivals</a></li>
        <li><a href="{% url 'catalog:shop' %}#bestsellers">Best sellers</a></li>
        <li><a href="{% url 'catalog:shop' %}#bundles">Bundles</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#">Account</a></li>
      </ul>
    </nav>
  </div>
</header>
