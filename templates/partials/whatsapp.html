{% if WHATSAPP_NUMBER %}
<a
  class="whatsapp-float"
  href="https://wa.me/{{ WHATSAPP_NUMBER }}"
  target="_blank"
  rel="noopener noreferrer"
  aria-label="WhatsApp order"
  data-order-wa
  data-wa-number="{{ WHATSAPP_NUMBER }}"
  data-preview-url="{% url 'cart:order_preview' %}"
  data-clear-url="{% url 'cart:clear' %}"
  {% if wa_order_context %}data-wa-context="{{ wa_order_context|escape }}"{% endif %}
  {% if wa_bundle_slug %}data-wa-bundle-slug="{{ wa_bundle_slug }}"{% endif %}
>
  <span class="whatsapp-float__label">WhatsApp order</span>
</a>
<form id="order-wa-csrf" hidden>{% csrf_token %}</form>
{% endif %}
