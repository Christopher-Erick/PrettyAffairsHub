{% extends "base.html" %}
{% block title %}Password updated — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-shell__panel">
    <p class="eyebrow">Done</p>
    <h1 class="auth-shell__title">Password updated</h1>
    <p class="auth-shell__lede">Your password has been changed. You can sign in with it now.</p>
    <p class="auth-shell__footer">
      <a class="btn btn--primary" href="{% url 'accounts:login' %}">Sign in</a>
    </p>
  </div>
</section>
{% endblock %}
